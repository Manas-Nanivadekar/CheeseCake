<!-- public/popup.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>YouTube Timer</title>
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      #timer {
        font-size: 24px;
        font-weight: bold;
        padding: 10px;
        border-radius: 4px;
        background-color: #f0f0f0;
        min-width: 100px;
        text-align: center;
      }

      #timer.running {
        background-color: #e8f5e9;
        color: #2e7d32;
      }

      button {
        padding: 8px 16px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>YouTube Timer</h2>
      <div id="timer">Time left: 2:00</div>
      <button id="resetTimer">Reset Timer</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
